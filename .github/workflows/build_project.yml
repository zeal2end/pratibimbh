name: Build and Test Go Project
on:
  push:
    branches:
      - develop_manas
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # Use a Linux runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'  # Set your Go version (use the required version)

      - name: Install Dependencies
        run: go mod tidy

      - name: Build
        run: go run cmd/main.go