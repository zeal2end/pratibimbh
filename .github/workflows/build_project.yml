name: Build and Test Go Project
on:
  push:
    branches:
      - develop_manas
  pull_request:
    branches:
      - main

jobs:
  build:
    env:
      DB_URL: ${{ secrets.DB_URL }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.0'

      - name: Install Dependencies
        run: go mod tidy

      - name: Build
        run: go build -v ./...